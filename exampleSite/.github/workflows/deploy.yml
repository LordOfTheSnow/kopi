# GitHub Pages deployment workflow for sites using the Kopi theme.
#
# Copy this file into YOUR site's repository (yoursite/.github/workflows/deploy.yml).
# Your site lives at the repo root, with the theme installed as a submodule:
#
#   git submodule add https://github.com/bect/kopi.git themes/kopi
#
# Then commit and push to `main`. Deployment steps:
#   1. In GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Push a commit (or run the workflow manually from the Actions tab)
#   3. The site is published at the URL shown under Settings > Pages
#
# A deployment is triggered on every push to the default branch.

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. Do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.157.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the theme (and any other Git submodules) recursively
          submodules: recursive
          fetch-depth: 0

      # If the site already declares the theme as a submodule (the recommended
      # setup — see the theme's README), the folder above is populated by the
      # recursive checkout and this step is a no-op. Otherwise we clone it as
      # a fallback so a site with `theme: 'kopi'` in hugo.yaml still builds.
      - name: Ensure theme (clone submodule unless present)
        run: |
          if [ -d "themes/kopi" ]; then
            echo "Theme found at themes/kopi"
          else
            echo "Theme submodule missing — cloning as fallback..."
            mkdir -p themes
            git clone --depth 1 https://github.com/bect/kopi.git themes/kopi
          fi

      # If the user forgot to set `theme: 'kopi'` in their config, add it
      # to the first config file found so the build still succeeds.
      - name: Ensure theme config is set
        run: |
          CONFIG=$(ls hugo.yaml hugo.yml config.yaml config.yml config.toml 2>/dev/null | head -n 1)
          if [ -z "$CONFIG" ]; then
            echo "No config file found — creating hugo.yaml with theme: kopi"
            printf "theme: 'kopi'\n" > hugo.yaml
          elif grep -qiE "theme:.*kopi|theme\s*=\s*[\"']kopi" "$CONFIG"; then
            echo "Theme already set to kopi in $CONFIG"
          else
            # Overwrite whatever theme is set so this workflow always builds with Kopi
            echo "Replacing theme with kopi in $CONFIG..."
            sed -i -E "s/^theme:[[:space:]].*/theme: 'kopi'/" "$CONFIG"
            sed -i -E "s/^theme\s*=\s*[\"'][^\"']*[\"']/theme = \"kopi\"/" "$CONFIG"
          fi

      - name: Install Hugo CLI (Extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      # The Kopi theme compiles SCSS with Dart Sass
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          # configure-pages provides the correct baseURL for user or project pages
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4