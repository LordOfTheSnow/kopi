<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<footer class="site-footer">
    <div class="container footer-content">
        <div>
            <strong class="footer-title">{{ .Site.Title }}</strong>
            {{ with .Site.Params.subtitle }}
                <span class="footer-subtitle">{{ . }}</span>
            {{ end }}
            <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
        </div>
        <div class="footer-social-links">
            {{ range .Site.Params.social }}
            <a href="{{ .url }}" class="btn-icon-action" target="_blank" rel="noopener noreferrer" aria-label="{{ .name | humanize }}">
                {{ partial "icons/social.html" .name }}
            </a>
            {{ end }}
            {{ with .Site.Home.OutputFormats.Get "rss" }}
            <a href="{{ .RelPermalink }}" class="btn-icon-action" aria-label="RSS Feed">
                {{ partial "icons/social.html" "rss" }}
            </a>
            {{ end }}
        </div>
    </div>
</footer>

<!-- Back to Top Button -->
<button id="backToTop" class="back-to-top" aria-label="Back to Top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
</button>
